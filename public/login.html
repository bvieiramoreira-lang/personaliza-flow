<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Personaliza Flow</title>
  <link rel="icon" type="image/png" href="/images/logow2.png">
  <link rel="shortcut icon" href="/images/logow2.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/logow2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Asap Sharp', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #4a2f6d;
      color: #ffffff;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    .top-spacer {
      flex: 1;
      min-height: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2.25rem;
      width: 100%;
    }

    .brand-logo-img {
      max-width: 330px;
      max-height: 95px;
      width: 100%;
      object-fit: contain;
      margin: 0 auto;
      display: block;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-group {
      width: 100%;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 1.5rem;
      background: #3C2857;
      border: none;
      border-radius: 50px;
      color: #ffffff;
      caret-color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      text-align: center;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #9d8cb5;
      text-align: center;
      font-size: 0.9rem;
    }

    .form-input:focus {
      background: #34204d;
      box-shadow: 0 0 0 2px rgba(161, 123, 233, 0.5);
    }

    .form-input:-webkit-autofill,
    .form-input:-webkit-autofill:hover, 
    .form-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0px 1000px #3C2857 inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .btn-login {
      width: 100%;
      height: 46px;
      padding: 0 1.5rem;
      background: linear-gradient(90deg, #A17BE9 0%, #7751B4 100%);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 0.25rem;
      box-shadow: 0 6px 18px rgba(119, 81, 180, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .btn-login:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(119, 81, 180, 0.45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      display: none;
      width: 100%;
      background: rgba(225, 29, 72, 0.25);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #ffe4e6;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.6rem 1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .bottom-footer {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      padding-top: 2rem;
      padding-bottom: 2rem;
      text-align: center;
    }

    .footer-text {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    .footer-text strong {
      color: #ffffff;
      font-weight: 700;
    }

    @media (max-height: 650px) {
      .top-spacer {
        display: none;
      }
      .bottom-footer {
        padding-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="top-spacer"></div>

  <div class="login-container">
    <div class="brand-header">
      <img src="/images/logo.png" alt="Personaliza Flow" class="brand-logo-img">
    </div>

    <div id="errorBox" class="error-box"></div>

    <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <input type="email" id="email" class="form-input" placeholder="E-mail" required autocomplete="email" aria-label="E-mail">
      </div>

      <div class="form-group" style="position: relative; display: flex; align-items: center;">
        <input type="password" id="password" class="form-input" placeholder="Senha" required autocomplete="current-password" aria-label="Senha" style="padding-right: 2.75rem; width: 100%;">
        <button type="button" onclick="toggleLoginPassword(this)" title="Mostrar senha" style="position: absolute; right: 0.6rem; background: none; border: none; cursor: pointer; color: #94a3b8; padding: 0.4rem; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" id="btnLogin" class="btn-login">Entrar</button>
    </form>
  </div>

  <footer class="bottom-footer">
    <p class="footer-text">
      Grupo <strong>Personaliza</strong> o <strong>maior</strong> hub de personalizados do <strong>Sul do Brasil.</strong>
    </p>
  </footer>

  <script>
    function toggleLoginPassword(btn) {
      const input = document.getElementById('password');
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        btn.title = "Ocultar senha";
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        btn.title = "Mostrar senha";
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const btnLogin = document.getElementById('btnLogin');

      errorBox.style.display = 'none';
      btnLogin.disabled = true;
      btnLogin.innerText = 'Entrando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao realizar login.');
        }

        // Salvar sessão
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('authUser', JSON.stringify(data.user));
        localStorage.setItem('appRole', data.user.role);

        window.location.href = '/index.html';
      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.innerText = 'Entrar';
      }
    }
  </script>
</body>
</html>
